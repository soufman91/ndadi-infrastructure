    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

        &lt;title id=&quot;infra-ndadi-title&quot;&gt;Réseau avec les photos des vrais équipements et des connexions animées&lt;/title&gt;
        &lt;desc id=&quot;infra-ndadi-description&quot;&gt;Une box Internet est reliée au pare-feu Stormshield SN210. Le Stormshield est relié au switch Aruba 2530. Le switch dessert deux HP ProLiant, un Raspberry Pi 4B, un TP-Link Archer C2600 et un NAS D-Link DNS-320L. Un ordinateur distant illustre un tunnel VPN vers le Stormshield. Les points bleus représentent un trafic simulé. Chaque équipement ouvre sa page de procédure. SRV-AD01 présente la mise en place AD DS, DNS et DHCP ; SRV-AD02 assure la redondance AD, DNS et DHCP Failover.&lt;/desc&gt;

            &lt;p&gt;Premier contrôleur de domaine de NDADI. Il centralise l’authentification des utilisateurs, la résolution DNS interne et l’attribution des adresses IP aux postes du VLAN utilisateurs.&lt;/p&gt;

      &lt;div class=&quot;proc-intro&quot;&gt;
        &lt;div class=&quot;proc-kicker&quot;&gt;Serveur de redondance&lt;/div&gt;
        &lt;h4&gt;SRV-AD02 · AD DS secondaire, DNS secondaire et DHCP Failover&lt;/h4&gt;
        &lt;p&gt;Second contrôleur de domaine de NDADI. Il réplique l’annuaire et le DNS de SRV-AD01 et prend le relais du DHCP en cas d’indisponibilité du serveur principal.&lt;/p&gt;
        &lt;div class=&quot;proc-facts&quot;&gt;
          &lt;div class=&quot;proc-fact&quot;&gt;&lt;b&gt;Système&lt;/b&gt;&lt;span&gt;Windows Server 2022&lt;/span&gt;&lt;/div&gt;

          &lt;div class=&quot;proc-fact&quot;&gt;&lt;b&gt;Domaine AD&lt;/b&gt;&lt;span&gt;ad.ndadi.fr&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;proc-fact&quot;&gt;&lt;b&gt;Passerelle&lt;/b&gt;&lt;span&gt;192.168.100.1&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;proc-role&quot;&gt;&lt;strong&gt;AD DS secondaire · DNS · DHCP Failover&lt;/strong&gt;&lt;span&gt;SRV-AD02 assure la continuité de l’authentification et de la résolution DNS. Le DHCP est configuré en mode serveur de secours avec SRV-AD01.&lt;/span&gt;&lt;/div&gt;

    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
